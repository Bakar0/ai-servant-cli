<!--
  servant workspace dashboard — a self-contained, OFFLINE page.

  Hard rules (enforced by tests, mirroring the insights --deep dashboard):
   - No network requests: no CDN-loaded scripts/stylesheets, no remote fonts/images, no fetch/XHR.
   - All styling is inline below; every icon is hand-rolled inline SVG (no library, no CDN mask URLs).
   - The CLI renderer fills exactly one slot: the JSON sentinel inside the application/json
     script#dashboard-data below. It writes NO markup per run — this file owns all of it; the
     per-panel markup is built here by inline JS reading that embedded payload.

  Composition (4 panels in 2 sections), ported from context/dashboard-design/:
    PROGRESS               — Mission hero · Delivery roadmap (phase timeline) · Architecture diagram
    DECISIONS & LEARNING   — Component map table
  The only absolute URL anywhere is the SVG namespace (a URI, never fetched).
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>servant workspace dashboard</title>

<style>
  :root {
    --bg: #0c0d14;
    --panel: #14161e;
    --raised: #191c25;
    --line: #262a37;
    --line-soft: #20232e;
    --hair: #1a1d27;
    --ink: #e8e9ef;
    --ink-2: #cfd2e0;
    --muted: #9a9cb0;
    --dim: #6a6d80;
    --faint: #595c70;
    --accent: #6e32e0;
    --accent-ink: #b69bff;
    --cyan: #84e4db;
    --green: #20d474;
    --green-ink: #3ee08a;
    --amber: #f2c94c;
    --node-dim: #3a3f52;
    --radius: 8px;
    --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: Figtree, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2c3040; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ── masthead ────────────────────────────────────────────────────────────── */
  header.masthead {
    position: sticky; top: 0; z-index: 5;
    background: rgba(12, 13, 20, 0.86); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line-soft);
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .mark {
    width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent) 15%, var(--cyan) 100%);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 17px;
  }
  .brand .lines { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .brand .title { font-size: 14px; color: var(--ink-2); }
  .brand .title span { color: var(--faint); }
  .brand .lead {
    font-size: 12px; color: var(--dim); max-width: 60ch;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ws-pill {
    display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0;
    font-size: 12px; color: var(--ink-2);
    background: var(--raised); border: 1px solid #2a2f3d; border-radius: 6px;
    padding: 6px 12px;
  }
  .ws-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px 32px 56px; }

  /* ── section header ──────────────────────────────────────────────────────── */
  .section-head { display: flex; align-items: center; gap: 12px; margin: 30px 0 16px; }
  .section-head .num { font-size: 11px; letter-spacing: 0.16em; color: var(--accent); font-weight: 600; }
  .section-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .section-head .note { font-size: 12px; color: var(--faint); }
  .section-head .rule { flex: 1; height: 1px; background: var(--line-soft); }

  /* ── panel shell (per 00 Foundations) ───────────────────────────────────────*/
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 16px; position: relative;
  }
  .panel.featured { }
  .panel.featured .accent-edge {
    position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--accent), var(--cyan));
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--line-soft);
  }
  .panel.featured .panel-head { padding-left: 18px; }
  .panel-head .htext { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .panel-head .eyebrow { font-size: 10px; letter-spacing: 0.14em; color: var(--dim); }
  .panel-head .ptitle { font-size: 15px; font-weight: 600; }
  .panel-head .hmeta { font-size: 11px; color: var(--faint); display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .panel-body { padding: 16px; }

  .empty {
    color: var(--faint); font-size: 13px; line-height: 1.55;
    border: 1px dashed var(--line); border-radius: 6px; background: var(--raised);
    padding: 22px; text-align: center;
  }

  /* ── mission hero ────────────────────────────────────────────────────────── */
  .mission-text { font-size: 16px; line-height: 1.55; color: var(--ink); font-weight: 500; margin: 0; }
  .mission-text.empty-line { color: var(--faint); font-weight: 400; font-style: italic; }

  /* ── where-we-are timeline ──────────────────────────────────────────────────*/
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line-soft);
            font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .legend span.k { display: inline-flex; align-items: center; gap: 6px; }
  .legend .ring { width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 2px solid var(--node-dim); }
  .legend .ring.done { border-color: var(--green); }
  .legend .ring.active { border-color: var(--amber); }

  .plan-group { margin-bottom: 8px; }
  .plan-group + .plan-group { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--hair); }
  .plan-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .plan-hd .name { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; min-width: 0; }
  .plan-hd .name .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plan-hd .count { font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; }

  .spine { position: relative; padding-left: 22px; }
  .spine .rail { position: absolute; left: 5px; top: 9px; bottom: 9px; width: 1.5px; background: var(--line); }
  .phase { position: relative; display: flex; align-items: center; gap: 10px; min-height: 30px; }
  .phase .tick {
    position: absolute; left: -21px; top: 50%; transform: translateY(-50%);
    width: 11px; height: 11px; border-radius: 50%; background: var(--panel); border: 2px solid var(--node-dim);
  }
  .phase.done .tick { border-color: var(--green); }
  .phase.active .tick { border-color: var(--amber); }
  .phase .pid { font-family: var(--mono); font-size: 11px; color: var(--dim); width: 26px; flex-shrink: 0; }
  .phase .plabel { font-size: 13px; color: var(--ink-2); }
  .phase.remaining { opacity: 0.72; }
  .phase.remaining .plabel { color: var(--muted); }
  .phase .grow { flex: 1; }
  .phase .note { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .phase .ok { color: var(--green-ink); display: inline-flex; }

  /* current ("you are here") phase */
  .phase.current {
    min-height: 34px; background: var(--raised); border-radius: 6px; margin: 2px 0;
    padding-right: 10px; padding-left: 0; overflow: hidden; opacity: 1;
  }
  .phase.current .edge {
    position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--accent), var(--cyan));
  }
  .phase.current .tick {
    width: 13px; height: 13px; border-color: var(--amber);
    box-shadow: 0 0 0 4px rgba(248, 203, 76, 0.12);
  }
  .phase.current .pid { color: var(--amber); padding-left: 10px; }
  .phase.current .plabel { color: var(--ink); font-weight: 500; }
  .now-pill {
    display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono);
    font-size: 10px; padding: 3px 9px; border-radius: 999px;
    background: rgba(248, 203, 76, 0.14); color: var(--amber); font-weight: 500;
  }

  /* ── architecture diagram ───────────────────────────────────────────────────*/
  .stage {
    position: relative; min-height: 360px; overflow: hidden;
    background: radial-gradient(circle at 1px 1px, #1d212c 1px, transparent 0);
    background-size: 22px 22px;
  }
  .stage svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; }
  .arch-node {
    position: absolute; transform: translate(-50%, -50%);
    font-family: var(--mono); font-size: 11px; padding: 7px 12px; border-radius: 6px;
    white-space: nowrap; cursor: grab; user-select: none;
    display: flex; align-items: center; gap: 6px; transition: box-shadow 0.12s;
  }
  .arch-node:active { cursor: grabbing; }
  .arch-node .nd { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.85; flex-shrink: 0; }
  .diagram-foot {
    padding: 9px 16px; border-top: 1px solid var(--line-soft);
    display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    font-family: var(--mono); font-size: 10px; color: var(--faint);
  }
  .diagram-foot .k { display: inline-flex; align-items: center; gap: 5px; }
  .diagram-foot .sw { width: 9px; height: 9px; border-radius: 2px; }
  .diagram-foot .sw.built { background: rgba(32, 212, 116, 0.14); border: 1px solid var(--green); }
  .diagram-foot .sw.now { background: var(--raised); border: 1px solid var(--amber); box-shadow: 0 0 0 2px rgba(110, 50, 224, 0.3); }
  .diagram-foot .sw.todo { background: var(--raised); border: 1px dashed var(--node-dim); }

  /* ── component map table ─────────────────────────────────────────────────────*/
  .table-scroll { overflow-x: auto; }
  .cmap { min-width: 860px; }
  .cmap .row {
    display: grid; grid-template-columns: 180px 1.2fr 150px 180px 1.5fr; gap: 14px;
    padding: 12px 16px; border-bottom: 1px solid var(--hair); align-items: start;
  }
  .cmap .row.head {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--faint);
    border-bottom: 1px solid var(--line-soft);
  }
  .cmap .row:last-child { border-bottom: 0; }
  .cmap .name { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink); }
  .cmap .name .dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; }
  .cmap .purpose { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .cmap .tech { display: flex; flex-wrap: wrap; gap: 5px; }
  .cmap .chip {
    font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 4px;
    background: #1c2030; border: 1px solid #2c3242; color: #9aa0b8;
  }
  .cmap .path { font-family: var(--mono); font-size: 11px; color: var(--dim); word-break: break-all; line-height: 1.45; }
  .cmap .decision {
    font-size: 11.5px; color: #787c92; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  footer.foot {
    color: var(--faint); font-size: 12px; margin: 40px auto 0; max-width: 1180px;
    border-top: 1px solid var(--line); padding: 14px 32px 0;
  }
</style>

<header class="masthead">
  <div class="brand">
    <span class="mark mono">$</span>
    <div class="lines">
      <span class="title mono">servant <span>workspace dashboard</span></span>
      <span class="lead" id="lead">Where we're going, where we are, and what we're building</span>
    </div>
  </div>
  <div class="ws-pill mono"><span class="dot"></span><span id="ws-name">—</span></div>
</header>

<div class="wrap" id="app"></div>
<footer class="foot" id="foot"></footer>

<script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>

<script>
  "use strict";
  // Read the injected, deterministic payload (no network, no deps). All per-panel markup below is
  // built from this embedded JSON — the renderer adds nothing.
  var DATA = JSON.parse(document.getElementById("dashboard-data").textContent || "{}");

  var SVGNS = "http://www.w3.org/2000/svg"; // the one permitted absolute URI — a namespace, never fetched.

  // ── tiny DOM helpers ────────────────────────────────────────────────────────
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var key in attrs) {
      if (key === "class") n.className = attrs[key];
      else if (key === "text") n.textContent = attrs[key];
      else if (key === "style") n.setAttribute("style", attrs[key]);
      else n.setAttribute(key, attrs[key]);
    }
    if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
      if (c == null || c === false) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }
  function svgEl(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var key in attrs) n.setAttribute(key, attrs[key]);
    return n;
  }
  function pad2(n) { return n < 10 ? "0" + n : String(n); }
  function fmtTs(ms) {
    try { return new Date(ms).toISOString().replace("T", " ").slice(0, 16) + " UTC"; }
    catch (e) { return "—"; }
  }

  // ── inline SVG icons (hand-rolled paths; no library, no CDN mask URLs) ───────
  var ICONS = {
    check:  [["path", { d: "M20 6 9 17l-5-5" }]],
    branch: [["line", { x1: 6, y1: 3, x2: 6, y2: 15 }], ["circle", { cx: 18, cy: 6, r: 3 }],
             ["circle", { cx: 6, cy: 18, r: 3 }], ["path", { d: "M18 9a9 9 0 0 1-9 9" }]],
    move:   [["path", { d: "M5 9l-3 3 3 3" }], ["path", { d: "M9 5l3-3 3 3" }],
             ["path", { d: "M15 19l-3 3-3-3" }], ["path", { d: "M19 9l3 3-3 3" }],
             ["path", { d: "M2 12h20" }], ["path", { d: "M12 2v20" }]],
    play:   [["path", { d: "M8 5v14l11-7z" }]],
  };
  function icon(name, size, opts) {
    opts = opts || {};
    var s = svgEl("svg", {
      viewBox: "0 0 24 24", width: size, height: size,
      fill: opts.fill || "none", stroke: opts.stroke || "currentColor",
      "stroke-width": opts.sw || 2, "stroke-linecap": "round", "stroke-linejoin": "round",
    });
    (ICONS[name] || []).forEach(function (d) { s.appendChild(svgEl(d[0], d[1])); });
    s.style.flexShrink = "0";
    return s;
  }

  // ── header / masthead fill ───────────────────────────────────────────────────
  var nameEl = document.getElementById("ws-name");
  if (nameEl) nameEl.textContent = "ws_" + (DATA.workspace || "—");
  if (DATA.mission) {
    var lead = document.getElementById("lead");
    if (lead) lead.textContent = DATA.mission;
  }

  var app = document.getElementById("app");

  function sectionHead(num, title, note) {
    return el("div", { class: "section-head" }, [
      el("span", { class: "num mono", text: pad2(num) }),
      el("h2", { text: title }),
      note ? el("span", { class: "note mono", text: note }) : null,
      el("span", { class: "rule" }),
    ]);
  }
  function panel(opts, bodyNodes) {
    var head = el("div", { class: "panel-head" }, [
      el("div", { class: "htext" }, [
        el("span", { class: "eyebrow mono", text: opts.eyebrow }),
        el("span", { class: "ptitle", text: opts.title }),
      ]),
      opts.meta ? el("span", { class: "hmeta mono" }, opts.meta) : null,
    ]);
    var children = [opts.featured ? el("span", { class: "accent-edge" }) : null, head];
    (Array.isArray(bodyNodes) ? bodyNodes : [bodyNodes]).forEach(function (b) { children.push(b); });
    return el("div", { class: "panel" + (opts.featured ? " featured" : "") }, children);
  }

  // ════════════════════════════════════════════════════════════════════════════
  //  SECTION 01 — PROGRESS
  // ════════════════════════════════════════════════════════════════════════════
  app.appendChild(sectionHead(1, "Progress"));

  // ── Mission (hero / featured) ─────────────────────────────────────────────────
  var missionBody = el("div", { class: "panel-body" }, [
    DATA.mission
      ? el("p", { class: "mission-text", text: DATA.mission })
      : el("p", { class: "mission-text empty-line", text: "No mission defined yet — run /servant:goal to set one." }),
  ]);
  app.appendChild(panel({ eyebrow: "PROGRESS", title: "Mission", featured: true }, missionBody));

  // ── Where we are (phase timeline) ─────────────────────────────────────────────
  function phaseNum(id) {
    var m = /^P(\d+)([a-z]?)$/i.exec(id || "");
    if (!m) return [Number.MAX_SAFE_INTEGER, id || ""];
    return [parseInt(m[1], 10), m[2] || ""];
  }
  function sortPhases(phases) {
    return (phases || []).slice().sort(function (a, b) {
      var na = phaseNum(a.id), nb = phaseNum(b.id);
      return na[0] - nb[0] || na[1].localeCompare(nb[1]);
    });
  }
  function phaseRow(ph, isCurrent) {
    var cls = "phase " + ph.state + (isCurrent ? " current" : "");
    var kids = [];
    if (isCurrent) kids.push(el("span", { class: "edge" }));
    kids.push(el("span", { class: "tick" }));
    kids.push(el("span", { class: "pid", text: ph.id }));
    // Labels are best-effort/unset for now — the mono id carries the identity when none is present.
    if (ph.label) kids.push(el("span", { class: "plabel", text: ph.label }));
    kids.push(el("span", { class: "grow" }));
    if (ph.note) kids.push(el("span", { class: "note", text: ph.note }));
    if (isCurrent) {
      kids.push(el("span", { class: "now-pill" }, [icon("play", 10, { fill: "currentColor", stroke: "none" }), "now"]));
    } else if (ph.state === "done") {
      kids.push(el("span", { class: "ok" }, icon("check", 14)));
    }
    return el("div", { class: cls }, kids);
  }

  var wwa = DATA.whereWeAre || { plans: [] };
  var current = wwa.current;
  var planned = (wwa.plans || []).filter(function (p) { return (p.totalCount || 0) > 0; });
  // The active plan (the one carrying the "you are here" marker) leads; the rest follow.
  planned.sort(function (a, b) {
    var ca = current && current.planTitle === a.title ? 0 : 1;
    var cb = current && current.planTitle === b.title ? 0 : 1;
    return ca - cb;
  });

  var wwaBody;
  if (planned.length) {
    var groups = planned.map(function (p) {
      var isCurrentPlan = !!(current && current.planTitle === p.title);
      var spine = el("div", { class: "spine" }, [el("span", { class: "rail" })]);
      sortPhases(p.phases).forEach(function (ph) {
        spine.appendChild(phaseRow(ph, isCurrentPlan && current.phaseId === ph.id));
      });
      return el("div", { class: "plan-group" }, [
        el("div", { class: "plan-hd" }, [
          el("span", { class: "name" }, [
            icon("branch", 13, { stroke: "#6a6d80" }),
            el("span", { class: "label", text: p.title }),
          ]),
          el("span", { class: "count", text: (p.doneCount || 0) + " / " + p.totalCount }),
        ]),
        spine,
      ]);
    });
    wwaBody = el("div", { class: "panel-body" }, groups);
  } else {
    wwaBody = el("div", { class: "panel-body" }, el("div", { class: "empty", text: "No plan phases to track yet." }));
  }
  var wwaLegend = el("div", { class: "legend" }, [
    el("span", { class: "k" }, [el("span", { class: "ring done" }), "done"]),
    el("span", { class: "k" }, [el("span", { class: "ring active" }), "active"]),
    el("span", { class: "k" }, [el("span", { class: "ring" }), "remaining"]),
  ]);
  var wwaPanel = panel({ eyebrow: "PROGRESS", title: "Delivery roadmap", meta: ["you are here"] }, [wwaLegend, wwaBody]);
  app.appendChild(wwaPanel);

  // ── Architecture diagram (build-state graph) ──────────────────────────────────
  var arch = DATA.architecture || { nodes: [], edges: [] };
  var archNodes = arch.nodes || [];
  var archEdges = arch.edges || [];

  function nodeStateStyle(state) {
    if (state === "in-progress")
      return "background:#1c1a26;border:1px solid #f2c94c;color:#f2c94c;box-shadow:0 0 0 3px rgba(110,50,224,.32),0 0 18px rgba(132,228,219,.28)";
    if (state === "todo")
      return "background:#191c25;border:1px dashed #3a3f52;color:#6a6d80";
    return "background:rgba(32,212,116,.1);border:1px solid #20d474;color:#7fe6a8";
  }

  // Deterministic layered layout: layer = longest dependsOn chain (leaves at the bottom, the root
  // command at the top), nodes spread evenly within a layer. A source-provided `position {x,y}` (in
  // percent) wins when present. No overlap; drag (below) can rearrange afterwards.
  function computeLayout(nodes, top, bottom) {
    var byId = {}; nodes.forEach(function (n) { byId[n.id] = n; });
    var depth = {}, mark = {};
    function d(id) {
      if (depth[id] != null) return depth[id];
      if (mark[id]) return 0; // cycle guard
      mark[id] = 1;
      var n = byId[id];
      var deps = (n && n.dependsOn ? n.dependsOn : []).filter(function (x) { return byId[x]; });
      var m = 0;
      deps.forEach(function (x) { m = Math.max(m, d(x) + 1); });
      depth[id] = m;
      return m;
    }
    nodes.forEach(function (n) { d(n.id); });
    var maxD = 0; nodes.forEach(function (n) { maxD = Math.max(maxD, depth[n.id]); });
    var layers = {};
    nodes.forEach(function (n) { (layers[depth[n.id]] = layers[depth[n.id]] || []).push(n); });
    var pos = {};
    for (var k = 0; k <= maxD; k++) {
      var layer = (layers[k] || []).slice().sort(function (a, b) { return a.id.localeCompare(b.id); });
      var y = maxD === 0 ? 50 : top + (bottom - top) * (1 - k / maxD); // higher depth → nearer the top
      var n = layer.length;
      layer.forEach(function (node, i) {
        var x = n === 1 ? 50 : 10 + 80 * (i / (n - 1));
        pos[node.id] = { x: x, y: y };
      });
    }
    // Honor any explicit source position (percent coords).
    nodes.forEach(function (node) {
      var p = node.position;
      if (p && typeof p.x === "number" && typeof p.y === "number") pos[node.id] = { x: p.x, y: p.y };
    });
    return pos;
  }

  var archPanelBody;
  if (archNodes.length) {
    var stage = el("div", { class: "stage" });
    var svg = svgEl("svg", { class: "edges", viewBox: "0 0 100 100", preserveAspectRatio: "none" });
    stage.appendChild(svg);

    var pos = computeLayout(archNodes, 12, 88);
    var nowId = null;
    archNodes.forEach(function (n) { if (n.state === "in-progress") nowId = n.id; });

    // edges (from dependent → dependency); highlight any edge touching the in-progress node
    var lineEls = archEdges.map(function (e) {
      var hot = nowId && (e.from === nowId || e.to === nowId);
      var ln = svgEl("line", {
        stroke: hot ? "#6e57c0" : "#2c3242", "stroke-width": "1.4", "vector-effect": "non-scaling-stroke",
      });
      return { e: e, ln: ln };
    });
    lineEls.forEach(function (o) { svg.appendChild(o.ln); });

    var nodeEls = {};
    archNodes.forEach(function (n) {
      var node = el("div", { class: "arch-node", title: n.label + " · " + n.state }, [
        el("span", { class: "nd" }),
        n.label,
      ]);
      node.setAttribute("style", "left:" + pos[n.id].x + "%;top:" + pos[n.id].y + "%;" + nodeStateStyle(n.state));
      nodeEls[n.id] = node;
      stage.appendChild(node);
    });

    function syncEdges() {
      lineEls.forEach(function (o) {
        var a = pos[o.e.from], b = pos[o.e.to];
        if (!a || !b) return;
        o.ln.setAttribute("x1", a.x); o.ln.setAttribute("y1", a.y);
        o.ln.setAttribute("x2", b.x); o.ln.setAttribute("y2", b.y);
      });
    }
    syncEdges();

    // drag-to-rearrange (nice-to-have; positions are not persisted back to the source)
    var drag = null;
    function onDown(id, ev) { ev.preventDefault(); drag = id; }
    function onMove(ev) {
      if (!drag) return;
      var r = stage.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var x = Math.max(6, Math.min(94, ((ev.clientX - r.left) / r.width) * 100));
      var y = Math.max(8, Math.min(92, ((ev.clientY - r.top) / r.height) * 100));
      pos[drag] = { x: x, y: y };
      var dn = nodeEls[drag];
      if (dn) dn.setAttribute("style", "left:" + x + "%;top:" + y + "%;" + nodeStateStyle(byStateOf(drag)));
      syncEdges();
    }
    function byStateOf(id) {
      for (var i = 0; i < archNodes.length; i++) if (archNodes[i].id === id) return archNodes[i].state;
      return "built";
    }
    function onUp() { drag = null; }
    archNodes.forEach(function (n) {
      nodeEls[n.id].addEventListener("pointerdown", function (ev) { onDown(n.id, ev); });
    });
    stage.addEventListener("pointermove", onMove);
    stage.addEventListener("pointerup", onUp);
    stage.addEventListener("pointerleave", onUp);

    var foot = el("div", { class: "diagram-foot" }, [
      el("span", { class: "k" }, [el("span", { class: "sw built" }), "built"]),
      el("span", { class: "k" }, [el("span", { class: "sw now" }), "in progress (now)"]),
      el("span", { class: "k" }, [el("span", { class: "sw todo" }), "todo"]),
      el("span", { style: "margin-left:auto", text: "edges = dependsOn" }),
    ]);
    archPanelBody = [stage, foot];
  } else {
    archPanelBody = el("div", { class: "panel-body" },
      el("div", { class: "empty", text: "Define your architecture in context/architecture.yaml to see the diagram." }));
  }
  app.appendChild(panel({
    eyebrow: "PROGRESS", title: "Architecture diagram",
    meta: archNodes.length ? [icon("move", 12, { stroke: "#595c70" }), "drag to rearrange"] : null,
  }, archPanelBody));

  // ════════════════════════════════════════════════════════════════════════════
  //  SECTION 02 — DECISIONS & LEARNING
  // ════════════════════════════════════════════════════════════════════════════
  app.appendChild(sectionHead(2, "Decisions & learning"));

  // ── Component map (table view of the architecture nodes) ──────────────────────
  function stateDot(state) {
    if (state === "in-progress") return "#f2c94c";
    if (state === "todo") return "#3a3f52";
    return "#20d474";
  }
  var cmapBody;
  if (archNodes.length) {
    var table = el("div", { class: "cmap" });
    table.appendChild(el("div", { class: "row head" }, [
      el("span", { text: "COMPONENT" }), el("span", { text: "PURPOSE" }),
      el("span", { text: "TECH" }), el("span", { text: "PATH" }), el("span", { text: "DECISION" }),
    ]));
    archNodes.forEach(function (n) {
      table.appendChild(el("div", { class: "row" }, [
        el("span", { class: "name" }, [
          el("span", { class: "dot", style: "background:" + stateDot(n.state) }),
          n.label,
        ]),
        el("span", { class: "purpose", text: n.purpose || "—" }),
        el("span", { class: "tech" }, (n.tech || []).map(function (t) { return el("span", { class: "chip", text: t }); })),
        el("span", { class: "path", text: n.path || "—" }),
        el("span", { class: "decision", title: n.decision || "", text: n.decision || "—" }),
      ]));
    });
    cmapBody = el("div", { class: "table-scroll" }, table);
  } else {
    cmapBody = el("div", { class: "panel-body" },
      el("div", { class: "empty", text: "No components defined yet." }));
  }
  app.appendChild(panel({
    eyebrow: "DECISIONS & LEARNING", title: "Component map",
    meta: [archNodes.length + " component" + (archNodes.length === 1 ? "" : "s")],
  }, cmapBody));

  // ── footer ────────────────────────────────────────────────────────────────────
  var footEl = document.getElementById("foot");
  if (footEl) {
    footEl.textContent =
      "servant " + (DATA.version || "?") + " · workspace " + (DATA.workspace || "—") +
      " · generated " + fmtTs(DATA.generatedAt);
  }
</script>
